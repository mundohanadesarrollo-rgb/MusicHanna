<div class="w-full">
  <img
    src="{{ track.cover_url }}"
    alt="{{ track.alt|default:track.title }}"
    loading="lazy"
    class="w-full bg-center bg-no-repeat aspect-square bg-cover rounded-lg object-cover"
  />
  <div class="mt-2">
    <p class="      text-[#F8F9FA] text-base font-medium leading-normal truncate">{{ track.title }}</p>
    <p class="text-slate-600   text-[#F8F9FA]/70 text-sm font-normal leading-normal">{{ track.artist }}</p>
  </div>
</div>
