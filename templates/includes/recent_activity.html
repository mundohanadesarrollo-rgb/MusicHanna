<h2
class="text-[#F8F9FA] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5"
>
Actividad de reproducción en vivo
</h2>
{% for actividad in actividad_reciente %}
<div class="flex flex-col">

  <div class="flex flex-col gap-3 px-4">
    <div class="flex items-center gap-4 rounded-lg bg-[#9D0208] p-3">
      <div class="w-12 h-12 …"></div>
      <div class="flex-grow min-w-0">
        <p class="…">
          <span>Sede {{ actividad.nro_sede }}</span>: {{ actividad.name }}
        </p>
        <p class="…">
          {{ actividad.author }} • 2,345 plays
        </p>
      </div>
      <div class="text-[#61CB61] ">
        ({{ actividad.status|title }})
      </div>
    </div>
  </div>
</div>
{% endfor %}
