{% load static %}
<div class="flex flex-col">
  <h2 class="text-[#F8F9FA] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">
    Reproducidas Recientemente
  </h2>
  <div class="flex overflow-y-auto [-ms-scrollbar-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
    <div id="recently-played-list" class="flex items-stretch p-4 gap-4 w-full">
      {% if recent_songs %}
        {% for song in recent_songs %}
          <div
            class="song-item flex h-full flex-1 flex-col gap-3 rounded-lg min-w-40 bg-[#A00000] p-4 transition-transform hover:scale-105 cursor-pointer"
            data-audio-url="{% if song.archivo_audio %}{{ song.archivo_audio.url }}{% endif %}"
            data-image-url="{% if song.imagen %}{{ song.imagen.url }}{% else %}{% static 'img/default_album_art.png' %}{% endif %}"
            data-title="{{ song.titulo|escape }}"
            data-artist="{{ song.artista.nombre|escape }}"
            data-id="{{ song.id }}"
          >
            <div
              class="w-full bg-center bg-no-repeat aspect-square bg-cover rounded-lg flex flex-col"
              style="background-image: url('{% if song.imagen %}{{ song.imagen.url }}{% else %}{% static 'img/default_album_art.png' %}{% endif %}');"
              role="img"
              aria-label="Portada de {{ song.titulo|escape }}"
            ></div>
            <div>
              <p class="text-[#F8F9FA] text-base font-medium leading-normal truncate">{{ song.titulo }}</p>
              <p class="text-[#F8F9FA]/70 text-sm font-normal leading-normal">{{ song.artista.nombre }}</p>
            </div>
          </div>
        {% endfor %}
      {% else %}
        <div class="p-4 text-[#F8F9FA]/80">No hay reproducciones recientes.</div>
      {% endif %}
    </div>
  </div>
</div>
