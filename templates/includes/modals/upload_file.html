<div
  class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50"
  id="uploadModal"
>
  <div
    class="bg-[#991b1b] dark:bg-[#991b1b] rounded-lg shadow-2xl w-full max-w-xl text-white transform transition-all"
  >
    <div
      class="p-6 border-b border-[#7f1d1d] dark:border-[#7f1d1d] flex justify-between items-center"
    >
      <h2 class="text-xl font-bold">Subir Canción</h2>
      <button id="closeModal" class="text-gray-300 hover:text-white transition-colors">
        <span class="material-icons-outlined">close</span>
      </button>
    </div>
    <div class="p-6 border-b border-[#7f1d1d] dark:border-[#7f1d1d]">
      <div class="flex items-center">
        <div class="flex items-center text-primary relative">
          <div
            class="rounded-full h-8 w-8 flex items-center justify-center bg-primary text-black font-bold"
          >
            1
          </div>
          <div class="ml-2 font-semibold">Subir</div>
        </div>
        <div class="flex-auto border-t-2 border-primary mx-4"></div>
        <div class="flex items-center text-gray-400 relative">
          <div
            class="rounded-full h-8 w-8 flex items-center justify-center border-2 border-gray-400"
          >
            2
          </div>
          <div class="ml-2">Confirmar</div>
        </div>
      </div>
    </div>
    <div class="p-8">
      <div
        class="border-2 border-dashed border-gray-500 rounded-lg p-10 text-center cursor-pointer hover:border-gray-400 transition-colors bg-black/20"
      >
        <div class="flex flex-col items-center text-gray-300">
          <span class="material-icons-outlined text-5xl mb-2"
            >cloud_upload</span
          >
          <p class="font-semibold">Arrastra y suelta tu canción aquí</p>
          <p class="text-sm text-gray-400">o haz click para buscar</p>
          <p class="text-xs text-gray-500 mt-4">MP3, WAV, FLAC hasta 100MB</p>
        </div>
        <input class="hidden" type="file" />
      </div>
      <div class="mt-6">
        <div
          class="flex items-center justify-between bg-[#7f1d1d] dark:bg-[#7f1d1d] p-4 rounded-lg"
        >
          <div class="flex items-center gap-4">
            <span class="material-icons-outlined text-2xl text-primary"
              >audio_file</span
            >
            <div>
              <p class="font-semibold text-white">Luces de Neón</p>
              <p class="text-sm text-gray-400">MP3</p>
            </div>
          </div>
          <button class="text-gray-400 hover:text-white">
            <span class="material-icons-outlined text-xl">delete</span>
          </button>
        </div>
      </div>
    </div>
    <div
      class="p-6 bg-[#7f1d1d] dark:bg-[#7f1d1d] rounded-b-lg flex justify-end gap-4"
    >
      <button
        class="px-6 py-2 rounded-lg text-white bg-transparent border border-gray-500 hover:bg-gray-600/20 transition-colors"
      >
        Cancelar
      </button>
      <button
        class="px-6 py-2 rounded-lg bg-primary text-black font-semibold hover:bg-opacity-90 transition-colors"
      >
        Subir Canción
      </button>
    </div>
  </div>
</div>
