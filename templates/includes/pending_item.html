{% load static %}
 <div class="flex flex-col">
        <h2
          class="text-[#F8F9FA] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5"
        >
          Subidas recientes
        </h2>
          <div class="flex flex-col gap-3 px-4 py-4">
            {% for subida in subidas_revision %}
            <div
              class="flex items-center gap-4 rounded-lg bg-[#9D0208] p-3 hover:bg-[#A00000] transition-colors"
            >
              <div
              class="w-12 h-12 bg-center bg-no-repeat aspect-square bg-cover rounded-md shrink-0"
                data-alt="Portada de {{ subida.name }}"
                style="background-image: url('{% if subida.imagen %}{{ subida.imagen.url }}{% else %}{% static 'img/default_album_art.png' %}{% endif %}');"
              ></div>
              <div class="grow min-w-0">
                <p
                  class="text-[#F8F9FA] text-base font-medium leading-normal truncate"
                >
                  {{ subida.name }}
                </p>
                <p
                  class="text-[#F8F9FA]/70 text-sm font-normal leading-normal truncate"
                >
                  {{ subida.author }}
                </p>
              </div>
              <p class="text-[#F8F9FA]/60 text-xs ml-auto whitespace-nowrap">
                {{ subida.fecha_subida|default:"Fecha no disponible" }}
              </p>
            </div>
            {% empty %}
            <p class="text-[#F8F9FA]/70 text-sm">No hay subidas pendientes.</p>
            {% endfor %}
          </div>
        </div>
