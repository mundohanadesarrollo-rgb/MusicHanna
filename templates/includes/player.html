{% load static %}
<footer
  class="fixed bottom-0 left-0 right-0 h-24 bg-[rgb(106,4,15)] border-t border-[#9D0208] p-4 z-60"
  aria-label="Player"
>
  <div
    class="flex items-center justify-between w-full h-full max-w-7xl mx-auto"
  >
    <audio id="audio-player" class="hidden"></audio>
    <div class="flex items-center gap-4 w-1/4">
      <img
        id="player-image"
        class="w-14 h-14 bg-center bg-no-repeat aspect-square bg-cover rounded-md shrink-0 object-cover"
        alt="Album art for the currently playing track"
        src="{% if current_song.imagen %}{{ current_song.imagen.url }}{% else %}{% static 'images/default_album_art.png' %}{% endif %}"
      />
      <div>
        <p id="player-title" class="text-[#F8F9FA] text-sm font-semibold leading-tight truncate">
          {{ current_song.titulo }}
        </p>
        <p id="player-artist" class="text-[#F8F9FA]/70 text-xs leading-tight">{{ current_song.artista.nombre }}</p>
      </div>
    </div>

    <div class="flex flex-col items-center gap-2 w-1/2">
      <div class="flex items-center gap-4 text-[#F8F9FA]">
        <button id="prev-btn" class="hover:text-[#F8F9FA]/80 transition-colors">
          <span class="material-symbols-outlined text-3xl">skip_previous</span>
        </button>
        <button
          id="play-pause-btn"
          class="w-12 h-12 flex items-center justify-center bg-[#9D0208] text-white rounded-full hover:bg-[#9D0208]/90 transition-colors shadow-lg"
        >
          <span id="play-icon" class="material-symbols-outlined text-4xl">play_arrow</span>
          <span id="pause-icon" class="material-symbols-outlined text-4xl" style="display: none;">pause</span>
        </button>
        <button id="next-btn" class="hover:text-[#F8F9FA]/80 transition-colors">
          <span class="material-symbols-outlined text-3xl">skip_next</span>
        </button>
      </div>
      <div class="flex items-center gap-2 w-full max-w-md">
        <span id="current-time" class="text-xs text-[#F8F9FA]/70">0:00</span>
        <div id="progress-bar-container" class="w-full bg-[#9D0208]/30 rounded-full h-1.5 cursor-pointer">
          <div id="progress-bar-fill" class="bg-[#F8F9FA] h-1.5 rounded-full" style="width: 0%"></div>
        </div>
        <span id="duration" class="text-xs text-[#F8F9FA]/70">0:00</span>
      </div>
    </div>

    <div class="flex items-center justify-end gap-2 w-1/4">
      <span class="material-symbols-outlined text-[#F8F9FA]/70">volume_up</span>
      <input
        id="volume-bar"
        class="w-24 h-1 accent-[#F8F9FA] bg-[#9D0208]/30 rounded-lg appearance-none cursor-pointer"
        max="100"
        min="0"
        type="range"
        value="100"
      />
    </div>
  </div>
</footer>
