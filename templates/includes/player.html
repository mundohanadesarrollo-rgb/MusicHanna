{% load static %}
<footer
  class="fixed bottom-0 left-0 right-0 h-24 bg-[rgb(106,4,15)] border-t border-[#9D0208] p-4 z-60"
  aria-label="Player"
  {%
  if
  sede
  %}data-sede-id="{{ sede.id }}"
  data-sid="{{ sede.id }}"
  {%
  elif
  sede_id
  %}data-sede-id="{{ sede_id }}"
  data-sid="{{ sede_id }}"
  {%
  endif
  %}
  data-user-id="{{ request.user.id }}"
  data-status-url="{% url 'update_sede_status' %}"
>
  <script>
    window.currentSedeId =
      "{% if sede %}{{ sede.id }}{% elif sede_id %}{{ sede_id }}{% endif %}";
  </script>
  <div
    class="flex items-center justify-between w-full h-full max-w-7xl mx-auto"
  >
    {% if current_song and current_song.archivo_audio %}
    <audio
      id="audio-player"
      src="{{ current_song.archivo_audio.url }}"
      preload="auto"
      data-current-id="{{ current_song.id }}"
    ></audio>
    {% else %}
    <audio id="audio-player" preload="auto"></audio>
    {% endif %}
    <div class="flex items-center gap-4 w-1/4">
      <img
        id="player-image"
        class="w-14 h-14 bg-center bg-no-repeat aspect-square bg-cover rounded-md shrink-0 object-cover"
        alt="Album art"
        src="{% if current_song.imagen %}{{ current_song.imagen.url }}{% else %}{% static 'img/default_album_art.png' %}{% endif %}"
      />
      <div>
        <p
          id="player-title"
          class="text-[#F8F9FA] text-sm font-semibold leading-tight truncate"
        >
          {{ current_song.titulo }}
        </p>
        <p id="player-artist" class="text-[#F8F9FA]/70 text-xs leading-tight">
          {{ current_song.artista.nombre }}
        </p>
      </div>
    </div>
    <div class="flex flex-col items-center gap-2 w-1/2">
      <div class="flex items-center gap-4 text-[#F8F9FA]">
        <button id="prev-btn" class="hover:text-[#F8F9FA]/80 transition-colors">
          <span class="material-symbols-outlined text-3xl">skip_previous</span>
        </button>
        <button
          id="play-pause-btn"
          class="w-12 h-12 flex items-center justify-center bg-[#9D0208] text-white rounded-full hover:bg-[#9D0208]/90 transition-colors shadow-lg"
        >
          <span id="play-icon" class="material-symbols-outlined text-4xl"
            >play_arrow</span
          >
          <span
            id="pause-icon"
            class="material-symbols-outlined text-4xl"
            style="display: none"
            >pause</span
          >
        </button>
        <button id="next-btn" class="hover:text-[#F8F9FA]/80 transition-colors">
          <span class="material-symbols-outlined text-3xl">skip_next</span>
        </button>
      </div>
      <div class="flex items-center gap-2 w-full max-w-md">
        <span id="current-time" class="text-xs text-[#F8F9FA]/70">0:00</span>
        <div
          id="progress-bar-container"
          class="w-full bg-[#9D0208]/30 rounded-full h-1.5 cursor-pointer"
        >
          <div
            id="progress-bar-fill"
            class="bg-[#F8F9FA] h-1.5 rounded-full"
            style="width: 0%"
          ></div>
        </div>
        <span id="duration" class="text-xs text-[#F8F9FA]/70">0:00</span>
      </div>
    </div>
    <div class="flex items-center justify-end gap-2 w-1/4">
      <span class="material-symbols-outlined text-[#F8F9FA]/70">volume_up</span>
      <input
        id="volume-bar"
        class="w-24 h-1 accent-[#F8F9FA] bg-[#9D0208]/30 rounded-lg appearance-none cursor-pointer"
        max="100"
        min="0"
        type="range"
        value="100"
      />
    </div>
  </div>
</footer>
<style>
  .song-active {
    transform: scale(1.03);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35),
      0 0 0 3px rgba(248, 249, 250, 0.06);
  }
  .song-item {
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const audioPlayer = document.getElementById("audio-player");
    const playPauseBtn = document.getElementById("play-pause-btn");
    const playIcon = document.getElementById("play-icon");
    const pauseIcon = document.getElementById("pause-icon");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const progressBarContainer = document.getElementById(
      "progress-bar-container"
    );
    const progressBarFill = document.getElementById("progress-bar-fill");
    const currentTimeEl = document.getElementById("current-time");
    const durationEl = document.getElementById("duration");
    const volumeBar = document.getElementById("volume-bar");
    const playerFooter = document.querySelector('footer[aria-label="Player"]');
    let playlist = [];
    let currentIndex = -1;
    let rawSedeId =
      playerFooter.dataset.sedeId ||
      playerFooter.dataset.sid ||
      window.currentSedeId;
    let sedeId = rawSedeId ? String(rawSedeId).trim() : null;
    const userId = playerFooter.dataset.userId;
    const statusApiUrl = playerFooter.dataset.statusUrl;
    const updateSedeStatus = (status) => {
      if (!sedeId)
        sedeId =
          playerFooter.dataset.sedeId ||
          playerFooter.dataset.sid ||
          window.currentSedeId;
      if (!sedeId || !statusApiUrl) {
        console.log("Player: Missing Sede ID or API URL", {
          sedeId,
          userId,
          statusApiUrl,
        });
        return;
      }
      const postData = { sede_id: sedeId, status: status };

      fetch(statusApiUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": "{{ csrf_token }}",
        },
        body: JSON.stringify(postData),
      })
        .then((r) => r.json())

        .catch((e) =>
          console.error("Error al actualizar el estado de la sede:", e)
        );
    };
    if (sedeId && audioPlayer.paused) {
      setTimeout(() => {
        if (audioPlayer.paused) updateSedeStatus("inactivo");
      }, 800);
    }
    playPauseBtn.addEventListener("click", () => {
      if (audioPlayer.paused) {
        audioPlayer
          .play()
          .catch((e) => console.error("Error al reproducir:", e));
      } else {
        audioPlayer.pause();
      }
    });
    audioPlayer.addEventListener("play", () => {
      playIcon.style.display = "none";
      pauseIcon.style.display = "inline";
      updateSedeStatus("activo");
    });
    audioPlayer.addEventListener("pause", () => {
      playIcon.style.display = "inline";
      pauseIcon.style.display = "none";
      updateSedeStatus("inactivo");
    });
    setInterval(() => {
      if (!audioPlayer.paused && sedeId) {
        updateSedeStatus("activo");
      }
    }, 30000);
    window.addEventListener("beforeunload", () => {
      if (sedeId && !audioPlayer.paused && statusApiUrl) {
        const data = { sede_id: sedeId, status: "inactivo" };
        const blob = new Blob([JSON.stringify(data)], {
          type: "application/json",
        });
        navigator.sendBeacon(statusApiUrl, blob);
      }
    });
    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${minutes}:${secs < 10 ? "0" : ""}${secs}`;
    }
    audioPlayer.addEventListener("loadedmetadata", () => {
      if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
        durationEl.textContent = formatTime(audioPlayer.duration);
      }
    });
    audioPlayer.addEventListener("timeupdate", () => {
      if (audioPlayer.duration) {
        const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        progressBarFill.style.width = `${progress}%`;
        currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
      }
    });
    progressBarContainer.addEventListener("click", (e) => {
      const width = progressBarContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = audioPlayer.duration || 0;
      if (duration) audioPlayer.currentTime = (clickX / width) * duration;
    });
    audioPlayer.volume = volumeBar.value / 100;
    volumeBar.addEventListener("input", (e) => {
      audioPlayer.volume = e.target.value / 100;
    });
    function buildPlaylistFromDOM() {
      const nodes = document.querySelectorAll(".song-item");
      playlist = Array.from(nodes).map((n) => ({
        audio: n.dataset.audioUrl || "",
        image: n.dataset.imageUrl || "",
        title: n.dataset.title || "",
        artist: n.dataset.artist || "",
        id: n.dataset.id || "",
      }));
    }
    function updateActiveClass() {
      const nodes = document.querySelectorAll(".song-item");
      nodes.forEach((n, i) => {
        if (i === currentIndex) {
          n.classList.add("song-active");
        } else {
          n.classList.remove("song-active");
        }
      });
    }
    function loadAndPlay(index) {
      if (!playlist.length || index < 0 || index >= playlist.length) return;
      const item = playlist[index];
      if (!item.audio) return;
      currentIndex = index;
      if (audioPlayer.src !== item.audio) audioPlayer.src = item.audio;
      const playerImage = document.getElementById("player-image");
      const playerTitle = document.getElementById("player-title");
      const playerArtist = document.getElementById("player-artist");
      if (playerImage && item.image) playerImage.src = item.image;
      if (playerTitle) playerTitle.textContent = item.title || "";
      if (playerArtist) playerArtist.textContent = item.artist || "";
      audioPlayer.play().catch((e) => console.error("Error al reproducir:", e));
      updateActiveClass();
    }
    function attachSongItemHandlers() {
      const nodes = document.querySelectorAll(".song-item");
      nodes.forEach((n, idx) => {
        n.addEventListener("click", () => {
          buildPlaylistFromDOM();
          loadAndPlay(idx);
        });
      });
    }
    function playPrev() {
      if (!playlist.length) return;
      const nextIndex =
        currentIndex > 0 ? currentIndex - 1 : playlist.length - 1;
      loadAndPlay(nextIndex);
    }
    function playNext() {
      if (!playlist.length) return;
      const nextIndex = (currentIndex + 1) % playlist.length;
      loadAndPlay(nextIndex);
    }
    prevBtn.addEventListener("click", (e) => {
      e.preventDefault();
      playPrev();
    });
    nextBtn.addEventListener("click", (e) => {
      e.preventDefault();
      playNext();
    });
    audioPlayer.addEventListener("ended", () => {
      playNext();
    });
    buildPlaylistFromDOM();
    attachSongItemHandlers();
    const serverCurrentId = audioPlayer.dataset.currentId;
    if (serverCurrentId && playlist.length) {
      const idx = playlist.findIndex(
        (p) => String(p.id) === String(serverCurrentId)
      );
      if (idx !== -1) {
        currentIndex = idx;
        const p = playlist[idx];
        const playerImage = document.getElementById("player-image");
        const playerTitle = document.getElementById("player-title");
        const playerArtist = document.getElementById("player-artist");
        if (playerImage && p.image) playerImage.src = p.image;
        if (playerTitle) playerTitle.textContent = p.title || "";
        if (playerArtist) playerArtist.textContent = p.artist || "";
        updateActiveClass();
      }
    } else if (playlist.length && !audioPlayer.src) {
      const p = playlist[0];
      const playerImage = document.getElementById("player-image");
      const playerTitle = document.getElementById("player-title");
      const playerArtist = document.getElementById("player-artist");
      if (playerImage && p.image) playerImage.src = p.image;
      if (playerTitle) playerTitle.textContent = p.title || "";
      if (playerArtist) playerArtist.textContent = p.artist || "";
    }
  });
</script>
