<!-- Modal para subir archivo -->
<div id="uploadModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-[#9D0208] rounded-lg shadow-xl p-6 sm:p-8 w-full max-w-lg border border-[#A00000]">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-[#F8F9FA]">Subir Nuevo Archivo</h2>
            <button id="closeModal" class="text-[#F8F9FA]/70 hover:text-[#F8F9FA] transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form method="post" action="{% url 'admin_uploads' %}" enctype="multipart/form-data">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="bg-red-500/20 border border-red-500 text-red-300 px-4 py-3 rounded-md mb-4" role="alert">
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}
            <div class="space-y-4">
                <div>
                    <label for="title" class="block text-sm font-medium text-[#F8F9FA]/80 mb-1">Título</label>
                    <input type="text" name="titulo" id="title" required class="w-full pl-3 pr-4 py-2 bg-[#A00000] border border-[#9D0208] rounded-md focus:ring-2 focus:ring-[#F8F9FA]/40 focus:border-transparent placeholder:text-[#F8F9FA]/70 text-[#F8F9FA]">
                </div>
                <div>
                    <label for="artist" class="block text-sm font-medium text-[#F8F9FA]/80 mb-1">Artista</label>
                    <input type="text" name="artist_name" id="artist" required class="w-full pl-3 pr-4 py-2 bg-[#A00000] border border-[#9D0208] rounded-md focus:ring-2 focus:ring-[#F8F9FA]/40 focus:border-transparent placeholder:text-[#F8F9FA]/70 text-[#F8F9FA]">
                </div>
                <div>
                    <label for="album" class="block text-sm font-medium text-[#F8F9FA]/80 mb-1">Álbum</label>
                    <input type="text" name="album_title" id="album" class="w-full pl-3 pr-4 py-2 bg-[#A00000] border border-[#9D0208] rounded-md focus:ring-2 focus:ring-[#F8F9FA]/40 focus:border-transparent placeholder:text-[#F8F9FA]/70 text-[#F8F9FA]">
                </div>
                <div>
                    <label for="image" class="block text-sm font-medium text-[#F8F9FA]/80 mb-1">Portada del Álbum</label>
                    <input type="file" name="imagen" id="image" accept="image/*" class="w-full text-sm text-[#F8F9FA] file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#F48C06] file:text-[#2B0808] hover:file:bg-[#FFB347]">
                </div>
                <div>
                    <label for="audio_file" class="block text-sm font-medium text-[#F8F9FA]/80 mb-1">Archivo de Audio</label>
                    <input type="file" name="archivo_audio" id="audio_file" accept="audio/*" required class="w-full text-sm text-[#F8F9FA] file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-[#F48C06] file:text-[#2B0808] hover:file:bg-[#FFB347]">
                </div>
            </div>
            <div class="mt-8 flex justify-end gap-4">
                <button type="button" onclick="document.getElementById('uploadModal').style.display='none'" class="px-4 py-2 text-sm font-medium bg-[#801019] text-[#F8F9FA] border border-[#9D0208] rounded-md hover:bg-[#B1121C] transition-colors">
                    Cancelar
                </button>
                <button type="submit" class="px-4 py-2 text-sm font-medium bg-[#F48C06] text-[#2B0808] rounded-md hover:bg-[#FFB347] transition-colors shadow">
                    Subir Archivo
                </button>
            </div>
        </form>
    </div>
</div>
